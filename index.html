<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LION — Math Game</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:   #F5A623;
      --orange: #E07B2A;
      --green:  #4A7C2F;
      --sky:    #87CEEB;
      --brown:  #3B1F0A;
    }

    body {
      font-family: 'Baloo 2', cursive;
      background: linear-gradient(180deg, #4AAEDE 0%, #87CEEB 28%, #C8E8F8 48%, #F5D87A 72%, #E8A84C 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ── SUN ── */
    .sun {
      position: fixed;
      top: 28px; right: 70px;
      width: 68px; height: 68px;
      background: radial-gradient(circle, #FFEE88 35%, #F5A623 100%);
      border-radius: 50%;
      box-shadow: 0 0 50px 18px rgba(255,220,60,0.35);
      z-index: 0; pointer-events: none;
    }

    /* ── ACACIA TREES ── */
    .tree {
      position: fixed; bottom: 56px;
      background: var(--brown);
      clip-path: polygon(50% 100%,44% 62%,20% 57%,35% 47%,10% 32%,38% 40%,30% 17%,50% 37%,65% 7%,62% 34%,85% 24%,70% 44%,90% 40%,62% 54%,56% 62%);
      z-index: 2; pointer-events: none;
    }
    .tree-r { right: 18px; width: 72px; height: 96px; opacity: 0.72; }
    .tree-l { left: 14px;  width: 52px; height: 70px; opacity: 0.50; }

    /* ── GROUND ── */
    .ground {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: 58px;
      background: linear-gradient(180deg, #B8813A 0%, #7A4E18 100%);
      z-index: 1; pointer-events: none;
    }

    /* ── GRASS ── */
    .grass-wrap {
      position: fixed; bottom: 50px; left: 0; right: 0;
      height: 75px; z-index: 3; pointer-events: none; overflow: hidden;
    }
    .grass-svg { width: 100%; height: 100%; }
    .blade { transform-box: fill-box; transform-origin: bottom center; }
    .blade:nth-child(3n+1) { animation: sw1 2.2s ease-in-out infinite alternate; }
    .blade:nth-child(3n+2) { animation: sw2 1.9s ease-in-out infinite alternate; }
    .blade:nth-child(3n)   { animation: sw1 2.6s ease-in-out infinite alternate; }
    @keyframes sw1 { from { transform: rotate(-5deg); } to { transform: rotate(6deg); } }
    @keyframes sw2 { from { transform: rotate(5deg);  } to { transform: rotate(-7deg); } }

    /* ── SCREENS ── */
    .screen {
      display: none; flex-direction: column; align-items: center;
      gap: 14px; position: relative; z-index: 10;
      width: 100%; max-width: 500px; padding: 18px 16px 110px;
    }
    .screen.active { display: flex; }

    /* ── CARD ── */
    .card {
      background: rgba(255,248,231,0.93);
      border-radius: 24px; padding: 22px 28px;
      box-shadow: 0 8px 32px rgba(59,31,10,0.18);
      width: 100%; display: flex; flex-direction: column;
      align-items: center; gap: 13px;
    }

    /* ── TITLE ── */
    .game-title {
      font-family: 'Fredoka One', cursive;
      font-size: 3.5rem; color: var(--orange);
      text-shadow: 3px 3px 0 var(--brown), -1px -1px 0 var(--gold);
      letter-spacing: 6px; line-height: 1;
    }

    /* ── LEVEL SELECT ── */
    .level-cards { display: flex; flex-direction: column; gap: 11px; width: 100%; }
    .level-card {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 16px; border-radius: 18px;
      border: 3px solid var(--orange); background: white;
      cursor: pointer;
      box-shadow: 0 4px 0 rgba(59,31,10,0.14);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .level-card:hover:not(.locked) { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(59,31,10,0.14); }
    .level-card:active:not(.locked){ transform: translateY(1px);  box-shadow: 0 2px 0 rgba(59,31,10,0.14); }
    .level-card.locked { opacity: 0.45; cursor: not-allowed; border-color: #bbb; }
    .lv-icon { font-size: 2rem; width: 40px; text-align: center; }
    .lv-info { flex: 1; text-align: left; }
    .lv-name { font-family: 'Fredoka One', cursive; font-size: 1.2rem; color: var(--brown); }
    .lv-desc { font-size: 0.78rem; color: #777; font-weight: 600; margin-top: 1px; }
    .lv-stars { font-size: 0.95rem; letter-spacing: 1px; }
    .lv-btn {
      font-family: 'Fredoka One', cursive; font-size: 1rem;
      padding: 8px 16px; background: var(--orange); color: white;
      border: none; border-radius: 12px; cursor: pointer;
      box-shadow: 0 3px 0 rgba(59,31,10,0.18);
    }
    .level-card.locked .lv-btn { background: #bbb; cursor: not-allowed; }

    /* ── PLAY HEADER ── */
    .play-header {
      display: flex; justify-content: space-between;
      align-items: center; width: 100%;
    }
    .score-display {
      font-size: 1.15rem; font-weight: 800; color: var(--brown);
      background: var(--gold); padding: 4px 15px;
      border-radius: 999px; border: 2px solid var(--orange);
    }
    .level-badge {
      font-family: 'Fredoka One', cursive; font-size: 0.9rem;
      color: white; background: var(--brown);
      padding: 3px 12px; border-radius: 999px;
    }

    /* ── TIMER ── */
    .timer-wrap { width: 100%; display: none; }
    .timer-wrap.on { display: block; }
    .timer-track {
      width: 100%; height: 13px; background: #e8e0d0;
      border-radius: 999px; overflow: hidden;
      border: 2px solid var(--orange);
    }
    .timer-fill {
      height: 100%; border-radius: 999px;
      background: var(--green);
      transition: width 1s linear, background 0.4s;
    }
    .timer-label {
      font-family: 'Fredoka One', cursive; font-size: 0.95rem;
      color: var(--brown); text-align: right; margin-top: 2px;
    }

    /* ── LION SVG ── */
    #lion-svg { filter: drop-shadow(1px 4px 5px rgba(59,31,10,0.22)); overflow: visible; }
    #lion-svg.shake { animation: shakeEl 0.45s ease; }

    /* ── LETTERS ── */
    .lion-letters { display: flex; gap: 11px; }
    .lion-letter {
      font-family: 'Fredoka One', cursive; font-size: 2rem; color: #ccc;
      transition: color 0.28s, transform 0.28s;
    }
    .lion-letter.earned {
      color: var(--orange); transform: scale(1.14);
      text-shadow: 1px 1px 0 var(--brown);
    }

    /* ── EQUATION ── */
    .equation {
      font-family: 'Fredoka One', cursive; font-size: 2.5rem;
      color: var(--brown); text-align: center; letter-spacing: 2px;
    }

    /* ── INPUT ── */
    .input-group { display: flex; gap: 10px; justify-content: center; }
    input[type="number"] {
      font-family: 'Baloo 2', cursive; font-size: 1.5rem; font-weight: 800;
      width: 108px; padding: 10px 12px;
      border: 3px solid var(--orange); border-radius: 14px;
      background: white; color: var(--brown); text-align: center;
      outline: none; -moz-appearance: textfield;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; }
    input:focus { border-color: var(--green); }
    input.flash-correct { animation: flashGreen 0.5s ease; }
    input.flash-wrong   { animation: shakeInput 0.5s ease; }

    /* ── BUTTONS ── */
    button {
      font-family: 'Fredoka One', cursive; font-size: 1.2rem;
      padding: 11px 24px; border: none; border-radius: 14px;
      cursor: pointer; box-shadow: 0 4px 0 rgba(59,31,10,0.22);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(59,31,10,0.18); }
    .btn-submit { background: var(--green); color: white; }
    .streak-hint { font-size: 0.82rem; color: var(--brown); font-weight: 600; min-height: 1.1em; }

    /* ── OVERLAYS ── */
    .overlay {
      display: none; position: fixed; inset: 0; z-index: 60;
      flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    }
    .overlay.active { display: flex; }
    .overlay-winner { background: rgba(60,110,35,0.93); }
    .overlay-lion   { background: rgba(40,15,3,0.93); }
    .overlay-unlock { background: rgba(224,123,42,0.96); }
    .overlay-text {
      font-family: 'Fredoka One', cursive; font-size: 4.5rem; color: white;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.28);
      animation: pulse 0.7s ease infinite alternate; text-align: center;
    }
    .overlay-sub { font-size: 1.35rem; font-weight: 800; color: rgba(255,255,255,0.9); text-align: center; }

    /* ── CONFETTI ── */
    #confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 50; }

    /* ── KEYFRAMES ── */
    @keyframes flashGreen {
      0%,100% { background: white; }
      40% { background: #b8f5b0; border-color: var(--green); }
    }
    @keyframes shakeInput {
      0%,100% { transform: translateX(0); background: white; }
      20% { transform: translateX(-8px); background: #ffd6d6; }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(4px); }
    }
    @keyframes shakeEl {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-7px); }
      80% { transform: translateX(4px); }
    }
    @keyframes pulse {
      from { transform: scale(1);    opacity: 1; }
      to   { transform: scale(1.07); opacity: 0.84; }
    }
  </style>
</head>

        <ellipse cx="100" cy="126" rx="12" ry="8" fill="white" stroke="#3B1F0A" stroke-width="2"/>
        <line x1="100" y1="134" x2="100" y2="140" stroke="#3B1F0A" stroke-width="2"/>
        <path d="M87,140 Q100,153 113,140" fill="none" stroke="#3B1F0A" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="73"  cy="128" r="2.5" fill="white"/>
        <circle cx="65"  cy="124" r="2.5" fill="white"/>
        <circle cx="60"  cy="131" r="2.5" fill="white"/>
        <circle cx="127" cy="128" r="2.5" fill="white"/>
        <circle cx="135" cy="124" r="2.5" fill="white"/>
        <circle cx="140" cy="131" r="2.5" fill="white"/>
      </g>
    </svg>

    <!-- Letters -->
    <div class="lion-letters" id="lion-letters-row">
      <span class="lion-letter" id="letter-L">L</span>
      <span class="lion-letter" id="letter-I">I</span>
      <span class="lion-letter" id="letter-O">O</span>
      <span class="lion-letter" id="letter-N">N</span>
    </div>

    <!-- Equation -->
    <div class="equation" id="equation-display">__ + __ = ?</div>

    <!-- Input -->
    <div class="input-group">
      <input type="number" id="answer-input" placeholder="?" autocomplete="off" min="0" max="9999"/>
      <button class="btn-submit" onclick="submitAnswer()">GO!</button>
    </div>

    <div class="streak-hint" id="streak-hint"></div>
  </div>
</div>

<!-- ═══════════════════ WINNER OVERLAY ═══════════════════ -->
<div id="overlay-winner" class="overlay overlay-winner">
  <div class="overlay-text">🎉 WINNER! 🎉</div>
  <div class="overlay-sub" id="winner-sub">Amazing job!</div>
</div>

<!-- ═══════════════════ UNLOCK OVERLAY ═══════════════════ -->
<div id="overlay-unlock" class="overlay overlay-unlock">
  <div class="overlay-text" style="font-size:3.2rem;">🔓 UNLOCKED!</div>
  <div class="overlay-sub" id="unlock-sub">Level 2 — Pride</div>
</div>

<!-- ═══════════════════ LION OVERLAY ═══════════════════ -->
<div id="overlay-lion" class="overlay overlay-lion">
  <div class="overlay-text" style="color:var(--gold);">LION</div>
  <div class="overlay-sub">Try again!</div>
</div>

<script>
/* ─────────────────────────────────────────────
   LEVEL CONFIG
───────────────────────────────────────────── */
const LEVELS = {
  1: { name: 'Cub',             icon: '🦁', stars: '⭐☆☆', questions: 10, maxWrong: 4, timer: 0,  maxNum: 20,  multMax: 0, desc: '+ and − up to 20 · 10 wins' },
  2: { name: 'Pride',           icon: '🦁🦁', stars: '⭐⭐☆', questions: 12, maxWrong: 4, timer: 0,  maxNum: 100, multMax: 6, desc: '+ − × up to 6 · 12 wins' },
  3: { name: 'King of Savanna', icon: '👑', stars: '⭐⭐⭐', questions: 15, maxWrong: 3, timer: 30, maxNum: 100, multMax: 6, desc: '× up to 6 · 30s timer · 3 strikes' },
};

/* ─────────────────────────────────────────────
   STATE
───────────────────────────────────────────── */
const state = {
  level: 1,
  score: 0,
  wrongCount: 0,
  consecutiveCorrect: 0,
  currentQuestion: null,
  phase: 'home',
  locked: false,
  timeLeft: 0,
  timerInterval: null,
};

function getUnlocked() {
  try { return JSON.parse(localStorage.getItem('lionUnlocked') || '[1]'); }
  catch { return [1]; }
}
function saveUnlocked(arr) {
  localStorage.setItem('lionUnlocked', JSON.stringify(arr));
}

/* ─────────────────────────────────────────────
   LION COLORING
───────────────────────────────────────────── */
const REGION_COLORS = {
  'region-mane':     '#E07B2A',
  'region-face':     '#F5A623',
  'region-ears':     '#F5A623',
  'region-features': '#3B1F0A',
};
const REGION_ORDER = ['region-mane','region-face','region-ears','region-features'];

function updateLionColor(wrongCount) {
  REGION_ORDER.forEach((id, i) => {
    const el = document.getElementById(id);
    if (!el) return;
    const color = i < wrongCount ? REGION_COLORS[id] : 'white';
    el.querySelectorAll('ellipse, circle, polygon').forEach(t => t.setAttribute('fill', color));
    // paths with fill="none" (eyebrows, mouth) should stay none
  });
}

/* ─────────────────────────────────────────────
   LEVEL SELECT UI
───────────────────────────────────────────── */
function renderLevelCards() {
  const unlocked = getUnlocked();
  const list = document.getElementById('level-cards-list');
  list.innerHTML = '';
  [1, 2, 3].forEach(n => {
    const lv = LEVELS[n];
    const isUnlocked = unlocked.includes(n);
    const card = document.createElement('div');
    card.className = 'level-card' + (isUnlocked ? '' : ' locked');
    card.innerHTML = `
      <div class="lv-icon">${lv.icon}</div>
      <div class="lv-info">
        <div class="lv-name">Level ${n} — ${lv.name}</div>
        <div class="lv-stars">${lv.stars}</div>
        <div class="lv-desc">${lv.desc}</div>
      </div>
      <button class="lv-btn" ${isUnlocked ? '' : 'disabled'}>${isUnlocked ? 'PLAY' : '🔒'}</button>
    `;
    if (isUnlocked) {
      card.addEventListener('click', () => startGame(n));
    }
    list.appendChild(card);
  });
}

/* ─────────────────────────────────────────────
   SCREEN
───────────────────────────────────────────── */
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
}

/* ─────────────────────────────────────────────
   QUESTION GENERATION
───────────────────────────────────────────── */
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function generateQuestion(level, score, streak) {
  const lv = LEVELS[level];
  const difficulty = score;
  const maxNum = level === 1
    ? Math.min(5 + difficulty * 2, lv.maxNum)        // 5→20 for Cub
    : Math.min(10 + difficulty * 6, lv.maxNum);      // 10→100 for Pride/King

  // Multiplication: level 2+ use 30% chance always; level 3 40%
  const multChance = level === 2 ? 0.30 : level === 3 ? 0.40 : 0;
  if (lv.multMax > 0 && Math.random() < multChance) {
    const num1 = rand(2, lv.multMax);
    const num2 = rand(2, lv.multMax);
    return { num1, operator: '×', num2, answer: num1 * num2 };
  }

  const operator = Math.random() < 0.5 ? '+' : '-';
  if (operator === '+') {
    const num1 = rand(0, maxNum);
    const num2 = rand(0, maxNum - num1);
    return { num1, operator, num2, answer: num1 + num2 };
  } else {
    const num1 = rand(0, maxNum);
    const num2 = rand(0, num1);
    return { num1, operator, num2, answer: num1 - num2 };
  }
}

/* ─────────────────────────────────────────────
   TIMER (level 3)
───────────────────────────────────────────── */
function startTimer() {
  stopTimer();
  const lv = LEVELS[state.level];
  if (!lv.timer) return;
  state.timeLeft = lv.timer;
  updateTimerUI();
  document.getElementById('timer-wrap').classList.add('on');
  state.timerInterval = setInterval(() => {
    state.timeLeft--;
    updateTimerUI();
    if (state.timeLeft <= 0) {
      stopTimer();
      const input = document.getElementById('answer-input');
      handleWrong(input);
    }
  }, 1000);
}

function stopTimer() {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
}

function updateTimerUI() {
  const total = LEVELS[state.level].timer || 30;
  const pct = (state.timeLeft / total) * 100;
  const fill = document.getElementById('timer-fill');
  const label = document.getElementById('timer-label');
  fill.style.width = pct + '%';
  fill.style.background = state.timeLeft > 15 ? 'var(--green)' : state.timeLeft > 7 ? '#E8A020' : '#C0392B';
  label.textContent = state.timeLeft + 's';
}

/* ─────────────────────────────────────────────
   GAME FLOW
───────────────────────────────────────────── */
function startGame(level) {
  state.level = level;
  state.score = 0;
  state.wrongCount = 0;
  state.consecutiveCorrect = 0;
  state.phase = 'playing';
  state.locked = false;

  const lv = LEVELS[level];
  document.getElementById('level-badge').textContent = lv.name;
  document.getElementById('score-goal').textContent = lv.questions;
  document.getElementById('timer-wrap').classList.remove('on');

  updateLionColor(0);
  updateLetters(0);
  document.getElementById('score-display').textContent = 0;
  loadNextQuestion();
  showScreen('play');
  setTimeout(() => document.getElementById('answer-input').focus(), 100);
}

function loadNextQuestion() {
  state.currentQuestion = generateQuestion(state.level, state.score, state.consecutiveCorrect);
  const { num1, operator, num2 } = state.currentQuestion;
  document.getElementById('equation-display').textContent = `${num1} ${operator} ${num2} = ?`;
  const input = document.getElementById('answer-input');
  input.value = ''; input.className = '';
  updateStreakHint();
  startTimer();
}

function updateLetters(wrongCount) {
  ['L','I','O','N'].forEach((l, i) => {
    document.getElementById('letter-' + l).classList.toggle('earned', i < wrongCount);
  });
}

function updateStreakHint() {
  const hint = document.getElementById('streak-hint');
  const s = state.consecutiveCorrect;
  if (s >= 5) { hint.textContent = `🔥 ${s} in a row — on fire!`; hint.style.color = 'var(--orange)'; }
  else if (s > 1) { hint.textContent = `⭐ ${s} correct in a row!`; hint.style.color = 'var(--green)'; }
  else hint.textContent = '';
}

/* ─────────────────────────────────────────────
   ANSWER SUBMISSION
───────────────────────────────────────────── */
function submitAnswer() {
  if (state.locked || state.phase !== 'playing') return;
  const input = document.getElementById('answer-input');
  const guess = parseInt(input.value.trim(), 10);
  if (isNaN(guess)) { input.value = ''; return; }
  stopTimer();
  if (guess === state.currentQuestion.answer) handleCorrect(input);
  else handleWrong(input);
}

function handleCorrect(input) {
  state.score++;
  state.consecutiveCorrect++;
  document.getElementById('score-display').textContent = state.score;
  input.classList.remove('flash-wrong'); void input.offsetWidth;
  input.classList.add('flash-correct');

  if (state.score >= LEVELS[state.level].questions) {
    state.phase = 'winner'; state.locked = true;
    setTimeout(showWinner, 400);
    return;
  }
  setTimeout(() => { input.classList.remove('flash-correct'); loadNextQuestion(); input.focus(); }, 500);
}

function handleWrong(input) {
  state.wrongCount++;
  state.consecutiveCorrect = 0;
  updateLetters(state.wrongCount);
  updateLionColor(state.wrongCount);

  input.classList.remove('flash-correct'); void input.offsetWidth;
  input.classList.add('flash-wrong');

  const lion = document.getElementById('lion-svg');
  lion.classList.remove('shake'); void lion.offsetWidth; lion.classList.add('shake');

  if (state.wrongCount >= LEVELS[state.level].maxWrong) {
    state.phase = 'lion'; state.locked = true;
    setTimeout(showLion, 600);
    return;
  }
  setTimeout(() => {
    input.classList.remove('flash-wrong'); lion.classList.remove('shake');
    loadNextQuestion(); input.focus();
  }, 650);
}

/* ─────────────────────────────────────────────
   WIN / LOSS
───────────────────────────────────────────── */
function showWinner() {
  // Check if a new level unlocks
  const justBeaten = state.level;
  const nextLevel = justBeaten + 1;
  const unlocked = getUnlocked();
  const newUnlock = nextLevel <= 3 && !unlocked.includes(nextLevel);
  if (newUnlock) { unlocked.push(nextLevel); saveUnlocked(unlocked); }

  document.getElementById('winner-sub').textContent =
    newUnlock ? `Level ${nextLevel} — ${LEVELS[nextLevel].name} unlocked! 🔓` : 'Amazing! Back to levels…';
  document.getElementById('overlay-winner').classList.add('active');
  startConfetti();

  flashEl('#overlay-winner .overlay-text', 3, () => {});

  setTimeout(() => {
    stopConfetti();
    document.getElementById('overlay-winner').classList.remove('active');
    if (newUnlock) {
      document.getElementById('unlock-sub').textContent = `Level ${nextLevel} — ${LEVELS[nextLevel].name}`;
      document.getElementById('overlay-unlock').classList.add('active');
      setTimeout(() => {
        document.getElementById('overlay-unlock').classList.remove('active');
        renderLevelCards();
        showScreen('home');
      }, 2500);
    } else {
      renderLevelCards();
      showScreen('home');
    }
  }, 4000);
}

function showLion() {
  document.getElementById('overlay-lion').classList.add('active');
  flashEl('#overlay-lion .overlay-text', 3, () => {});
  setTimeout(() => {
    document.getElementById('overlay-lion').classList.remove('active');
    renderLevelCards();
    showScreen('home');
  }, 3200);
}

function flashEl(selector, times, cb) {
  const el = document.querySelector(selector);
  let n = 0;
  const iv = setInterval(() => {
    el.style.visibility = el.style.visibility === 'hidden' ? 'visible' : 'hidden';
    if (++n >= times * 2) { clearInterval(iv); el.style.visibility = 'visible'; cb(); }
  }, 500);
}

/* ─────────────────────────────────────────────
   CONFETTI
───────────────────────────────────────────── */
const CC = ['#F5A623','#E07B2A','#4A7C2F','#87CEEB','#fff','#ff6b6b','#ffe66d'];
let cPieces = [], cAnim = null;

function startConfetti() {
  const cv = document.getElementById('confetti-canvas');
  cv.width = innerWidth; cv.height = innerHeight;
  cPieces = Array.from({ length: 130 }, () => ({
    x: Math.random() * cv.width, y: Math.random() * -cv.height * 0.5,
    r: rand(5, 12), color: CC[rand(0, CC.length - 1)],
    speed: 2 + Math.random() * 3, angle: Math.random() * 6.28,
    spin: (Math.random() - 0.5) * 0.2, drift: (Math.random() - 0.5) * 1.5,
  }));
  const ctx = cv.getContext('2d');
  (function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    cPieces.forEach(p => {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
      ctx.fillStyle = p.color; ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r * 0.55); ctx.restore();
      p.y += p.speed; p.x += p.drift; p.angle += p.spin;
      if (p.y > cv.height + 20) { p.y = -20; p.x = Math.random() * cv.width; }
    });
    cAnim = requestAnimationFrame(draw);
  })();
}
function stopConfetti() {
  if (cAnim) { cancelAnimationFrame(cAnim); cAnim = null; }
  const cv = document.getElementById('confetti-canvas');
  cv.getContext('2d').clearRect(0, 0, cv.width, cv.height);
}

/* ─────────────────────────────────────────────
   INIT
───────────────────────────────────────────── */
document.getElementById('answer-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitAnswer();
});

renderLevelCards();
</script>
