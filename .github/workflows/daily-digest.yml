name: Daily Intelligence Digest

on:
  schedule:
    # 6am ET = 11am UTC (adjust to 10am UTC during EDT, Nov–Mar use 11am)
    - cron: "0 11 * * *"
  workflow_dispatch:  # allows manual trigger from GitHub UI for testing

jobs:
  send-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic atoma requests

      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python daily-digest/digest.py
